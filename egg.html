<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandstorm</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  #c, #c ruffle-player { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="c"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.1/ruffle.js"></script>
<script>
// Plays sandstorm.swf once through Ruffle (Flash emulator), then closes the window.
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, contextMenu: "off" };
addEventListener("load", () => {
  const p = RufflePlayer.newest().createPlayer();
  document.getElementById("c").appendChild(p);
  p.addEventListener("loadedmetadata", () => {
    const m = p.metadata;
    setTimeout(() => { p.remove(); window.close(); }, m.numFrames / m.frameRate * 1000 - 60);
  });
  p.load("sandstorm.swf");
});
</script>
</body>
</html>
