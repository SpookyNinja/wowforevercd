<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Countdown</title>
<style>
  :root { --gold:#f5c542; --red:#d11a1a; --bg:#050505; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:#fff; font-family:"Courier New",monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
         background:radial-gradient(ellipse at center,#1a1206 0%,#050505 70%); }
  h1 { font-size:clamp(1rem,3vw,2rem); letter-spacing:.4em; color:var(--gold); text-transform:uppercase; margin-bottom:2vh; padding:0 4vw; }
  #egg { user-select:none; cursor:default; display:inline-block; --heat:0;
         text-shadow:0 0 calc(var(--heat) * 28px) rgba(255,220,120,calc(var(--heat) * 1.2));
         color:color-mix(in srgb, var(--gold), #fff calc(var(--heat) * 70%)); transition:text-shadow .3s, color .3s; }
  #egg.shake { animation:shake .25s; }
  @keyframes shake { 25%{transform:translateX(calc(var(--heat) * -6px)) rotate(calc(var(--heat) * -3deg));}
                     75%{transform:translateX(calc(var(--heat) * 6px)) rotate(calc(var(--heat) * 3deg));} }
  #tip { margin-top:2vh; color:#c9a85a; font-size:clamp(.7rem,1.5vw,1rem); letter-spacing:.08em; padding:0 6vw;
         min-height:1.5em; transition:opacity .6s; }
  #tip b { color:var(--gold); }
  #tip.hide { opacity:0; }
  #clock { display:flex; gap:clamp(.4rem,2vw,2rem); align-items:flex-start; justify-content:center; }
  .unit { display:flex; flex-direction:column; align-items:center; }
  .num { font-size:clamp(2rem,11vw,14rem); font-weight:bold; line-height:1; font-variant-numeric:tabular-nums;
         color:#fff; text-shadow:0 0 30px rgba(245,197,66,.45); }
  .lbl { font-size:clamp(.6rem,1.5vw,1.2rem); letter-spacing:.3em; color:#888; margin-top:1vh; text-transform:uppercase; }
  .sep { font-size:clamp(2rem,11vw,14rem); line-height:1; color:var(--gold); opacity:.6; }
  #sub { margin-top:4vh; color:#777; font-size:clamp(.7rem,1.6vw,1.1rem); letter-spacing:.15em; padding:0 4vw; }
  #sec.pulse { animation:pulse .5s ease-out; }
  @keyframes pulse { 0%{transform:scale(1.12); color:var(--gold);} 100%{transform:scale(1);} }
  body.final .num#sec { color:var(--red); text-shadow:0 0 40px rgba(209,26,26,.8); }
  body.final { animation:flash 1s infinite; }
  @keyframes flash { 0%{background-color:#2a0000;} 100%{background-color:#050505;} }
  #gate { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; flex-direction:column; gap:2rem;
          align-items:center; justify-content:center; cursor:pointer; z-index:10; }
  #gate b { color:var(--gold); font-size:clamp(1.2rem,4vw,2.5rem); letter-spacing:.3em; }
  #gate span { color:#888; letter-spacing:.2em; }
  #bar { position:fixed; top:1rem; right:1rem; display:flex; gap:.5rem; align-items:center; z-index:5; flex-wrap:wrap; justify-content:flex-end; }
  #bar input { width:90px; accent-color:var(--gold); }
  #ytbox { position:fixed; width:1px; height:1px; bottom:0; right:0; opacity:0; pointer-events:none; overflow:hidden; }
  #mute, #mmute {  background:none; border:1px solid #444; color:#aaa; padding:.5rem .9rem;
          font:inherit; cursor:pointer; z-index:5; }
  #mute:hover, #mmute:hover { color:#fff; border-color:#fff; }
  /* disco mode (type "dt") */
  #undisco { display:none; background:linear-gradient(90deg,#ff3cac,#ffe53b,#2bd2ff,#7cff6b); border:none; color:#000;
             font:inherit; font-weight:bold; padding:.5rem .9rem; cursor:pointer; }
  body.disco #undisco { display:inline-block; }
  body.disco #mute, body.disco #mmute { background:rgba(0,0,0,.65); color:#fff; border-color:#fff; }
  body.disco #ver { color:#000 !important; }
  body.disco { background:linear-gradient(120deg,#ff0080,#ff8c00,#ffe600,#00e676,#00b0ff,#d500f9,#ff0080);
               background-size:400% 400%; animation:rainbow 4s linear infinite; }
  body.disco::after { content:""; position:fixed; inset:-50%; pointer-events:none; z-index:1; mix-blend-mode:soft-light;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.55) 0 8deg, transparent 8deg 30deg);
    animation:spin 6s linear infinite; }
  body.disco .num, body.disco .sep, body.disco h1, body.disco .lbl, body.disco #sub, body.disco #tip, body.disco #tip b
    { color:#fff; text-shadow:0 0 12px #000, 0 0 30px rgba(0,0,0,.6); opacity:1; }
  body.disco .num { animation:bounce .5s ease-in-out infinite alternate; }
  @keyframes rainbow { 0%{background-position:0% 50%;} 100%{background-position:400% 50%;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes bounce { to { transform:translateY(-4%) scale(1.04); } }
  #eggbox { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.85); }
  #eggbox.on { display:flex; }
  #eggstage { position:relative; width:min(90vw, calc((100vh - 7rem) * 4 / 3), 960px); aspect-ratio:4/3; background:#000; box-shadow:0 0 60px rgba(245,197,66,.35); }
  #eggstage ruffle-player { display:block; width:100%; height:100%; }
  #eggclose { position:absolute; top:-2.4rem; right:0; background:none; border:1px solid #666; color:#ccc; font:inherit; padding:.2rem .6rem; cursor:pointer; }
  #eggclose:hover { color:#fff; border-color:#fff; }
  /* Thunderfury easter egg (type "thunderfury") */
  #tfchat { position:fixed; left:1rem; bottom:2.2rem; width:min(560px, calc(100vw - 2rem)); background:rgba(8,8,10,.88); border:1px solid #333;
            padding:.5rem .7rem; font-family:Arial,Helvetica,sans-serif; font-size:clamp(.75rem,1.6vw,.95rem); text-align:left;
            z-index:15; opacity:0; transform:translateY(1rem); transition:opacity .5s, transform .5s; pointer-events:none; }
  #tfchat.on { opacity:1; transform:none; }
  #tfchat p { color:#ffc0c0; margin:.15rem 0; text-shadow:1px 1px 0 #000; }
  #tfchat .lg { color:#ff8000; }
  #flash { position:fixed; inset:0; background:#d8e8ff; opacity:0; pointer-events:none; z-index:14; }
  #flash.on { animation:bolt 1.4s; }
  @keyframes bolt { 0%{opacity:0;} 4%{opacity:.9;} 9%{opacity:0;} 14%{opacity:.7;} 22%{opacity:0;} 40%{opacity:.35;} 48%{opacity:0;} 100%{opacity:0;} }
  #done { display:none; font-size:clamp(2rem,9vw,8rem); color:var(--gold); text-shadow:0 0 40px rgba(245,197,66,.8); }
</style>
</head>
<body>
  <div id="bar">
    <button id="undisco">✋ Un-disco</button>
    <button id="mmute" aria-label="Toggle music">🎵 Music on</button>
    <input id="vol" type="range" min="0" max="100" value="35" aria-label="Music volume">
    <button id="mute" aria-label="Toggle sound">🔊 Ticks on</button>
  </div>
  <div id="ytbox"><div id="yt"></div></div>
  <h1>World of Warcraft: <span id="egg">Forever</span></h1>
  <div id="clock">
    <div class="unit"><div class="num" id="d">00</div><div class="lbl">Days</div></div><div class="sep">:</div>
    <div class="unit"><div class="num" id="h">00</div><div class="lbl">Hours</div></div><div class="sep">:</div>
    <div class="unit"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div><div class="sep">:</div>
    <div class="unit"><div class="num" id="sec">00</div><div class="lbl">Seconds</div></div>
  </div>
  <div id="done">IT HAS BEGUN</div>
  <p id="sub"></p>
  <p id="tip"></p>
  <p id="ver" style="position:fixed;bottom:.5rem;left:.8rem;color:#444;font-size:.7rem"></p>

  <div id="flash"></div>
  <div id="tfchat"></div>
  <div id="eggbox"><div id="eggstage"><button id="eggclose" aria-label="Close">✕</button></div></div>

  <div id="gate"><b>ENTER</b><span>click anywhere to start the countdown with sound</span></div>

<script>
// GitHub Pages caches pages for 10 min. On open, compare with version.txt (never cached) and
// reload under a fresh ?v= URL if this copy is outdated. Bump VERSION and version.txt together.
const VERSION = "15";
document.getElementById("ver").textContent = "v" + VERSION;
fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
  v = v.trim();
  if (v && v !== VERSION && new URLSearchParams(location.search).get("v") !== v)
    location.replace(location.pathname + "?v=" + encodeURIComponent(v));
}).catch(() => {});

// ===== CONFIG: edit this to change the launch moment (ISO 8601, with timezone) =====
// Nov 4, 2026, 3 PM Pacific = midnight CET Nov 5 = 23:00 UTC
const LAUNCH = new Date("2026-11-04T23:00:00Z");
// Background music: YouTube video id (Seasons of War, WoW soundtrack). Plays audio only, loops.
const MUSIC_ID = "X-PNMaf7C-o";
// ===================================================================================

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
let ctx = null, muted = false, eggOn = false, lastSec = null, finished = false;

$("sub").textContent = "Launch: " + LAUNCH.toLocaleString(undefined, { dateStyle:"full", timeStyle:"long" });

// ---------- Sound (synthesized with Web Audio, no files needed) ----------
let master = null, verb = null, tickBuf = null;
function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25;
    master.connect(comp).connect(ctx.destination);
    // generated reverb tail for a big, hollow room
    const len = ctx.sampleRate * 2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb = ctx.createConvolver(); verb.buffer = ir;
    const vg = ctx.createGain(); vg.gain.value = 0.55;
    verb.connect(vg).connect(master);
    // optional custom sample: drop a short "tick.mp3" next to index.html and it replaces the synth thump
    fetch("tick.mp3").then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(b => ctx.decodeAudioData(b)).then(buf => { tickBuf = buf; }).catch(() => {});
  }
  if (ctx.state === "suspended") ctx.resume();
}
function out(node, wet) { node.connect(master); if (wet) node.connect(verb); }
function tone(freq, type, start, dur, vol) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); out(g, true);
  o.start(start); o.stop(start + dur + 0.05);
}
// Deep cinematic thump: pitch-dropping sub kick + low noise knock + booming tail
function tick(final) {
  if (!ctx || muted || eggOn) return;
  const t = ctx.currentTime, k = final ? 1 : 0.8;
  if (tickBuf) {
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = tickBuf; g.gain.value = final ? 1 : 0.8;
    src.connect(g); out(g, false); src.start(t);
    return;
  }
  // 1) mechanical clock "clack": tight noise burst through a mid-high bandpass
  const nb = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
  n.buffer = nb; bp.type = "bandpass"; bp.frequency.value = final ? 1100 : 800; bp.Q.value = 1;
  ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.45 * k, t + 0.004); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  n.connect(bp).connect(ng); out(ng, true); n.start(t);
  // hollow "tink" body of the click
  tone(final ? 700 : 520, "triangle", t, 0.05, 0.1 * k);
  // 2) digital sub-pulse: low sine with a fast pitch drop, short decay
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(final ? 110 : 90, t);
  o.frequency.exponentialRampToValueAtTime(final ? 55 : 50, t + 0.03);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1.2 * k, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (final ? 0.28 : 0.2));
  o.connect(g); out(g, true); o.start(t); o.stop(t + 0.4);
}
function fanfare() {
  if (!ctx || muted) return;
  const t = ctx.currentTime;
  [261.6, 329.6, 392, 523.3, 659.3, 784].forEach((f, i) => {
    tone(f, "sawtooth", t + i * 0.12, 1.8, 0.12);
    tone(f / 2, "triangle", t + i * 0.12, 2.2, 0.15);
  });
}

// ---------- UI ----------
function render(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const d = Math.floor(total / 86400), h = Math.floor(total % 86400 / 3600),
        m = Math.floor(total % 3600 / 60), s = total % 60;
  $("d").textContent = pad(d); $("h").textContent = pad(h);
  $("m").textContent = pad(m); $("sec").textContent = pad(s);
  return total;
}
function update() {
  const total = render(LAUNCH - Date.now());
  if (total !== lastSec) {
    if (lastSec !== null && !finished) {
      if (total > 0) tick(total <= 10);      const el = $("sec"); el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
    }
    lastSec = total;
    document.body.classList.toggle("final", total > 0 && total <= 10);
    if (total === 0 && !finished) {
      finished = true;
      $("clock").style.display = "none"; $("done").style.display = "block";
      document.body.classList.remove("final");
      fanfare();
    }
  }
  if (!finished) {
    // wake up right at the next second boundary to stay in sync
    const ms = (LAUNCH - Date.now()) % 1000;
    setTimeout(update, ms > 20 ? ms - 10 : 20);
  }
}

// ---------- Background music ----------
// Hidden YouTube player (audio only). Typing "dt" swaps it for Hakkin Disco until "Un-disco" is pressed.
let yt = null, musicOn = true, disco = false, discoGain = null, discoSrc = [], discoBufs = null;
const vol = () => +$("vol").value;
function startYouTube() {
  if (!MUSIC_ID || yt) return;
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("yt", {
      width: "200", height: "200", videoId: MUSIC_ID,
      playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: e => { e.target.setVolume(vol()); if (musicOn && !disco) e.target.playVideo(); },
        onStateChange: e => { if (e.data === YT.PlayerState.ENDED && !disco) e.target.seekTo(0).playVideo(); }
      }
    });
  };
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
function startDisco() {
  if (disco) return;
  disco = true;
  document.body.classList.add("disco");
  if (yt && yt.pauseVideo) yt.pauseVideo();
  discoGain = ctx.createGain(); discoGain.gain.value = musicOn && !eggOn ? vol() / 100 : 0;
  discoGain.connect(ctx.destination);
  const load = u => fetch(u).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b));
  discoBufs = discoBufs || Promise.all([load("disco-intro.mp3"), load("disco-loop.mp3")]);
  discoBufs.then(([intro, loop]) => {
    if (!disco) return;
    // intro once, then the loop seamlessly forever
    const t = ctx.currentTime + 0.05;
    const a = ctx.createBufferSource(); a.buffer = intro; a.connect(discoGain); a.start(t);
    const l = ctx.createBufferSource(); l.buffer = loop; l.loop = true; l.connect(discoGain); l.start(t + intro.duration);
    discoSrc = [a, l];
  }).catch(() => {});
}
function stopDisco() {
  if (!disco) return;
  disco = false;
  document.body.classList.remove("disco");
  discoSrc.forEach(n => { try { n.stop(); } catch (e) {} }); discoSrc = [];
  discoGain.disconnect(); discoGain = null;
  if (musicOn && !eggOn && yt && yt.playVideo) yt.playVideo();
}
let typed = "";
addEventListener("keydown", e => {
  if (!ctx || e.key.length !== 1) return;
  typed = (typed + e.key.toLowerCase()).slice(-11);
  if (typed.endsWith("thunderfury")) { typed = ""; thunderfury(); }
  else if (typed.endsWith("dt")) startDisco(); // Dirty Tactics
});

// ---------- Easter egg: type "thunderfury" -> lightning + Trade chat spam ----------
const TF_LINK = "[Thunderfury, Blessed Blade of the Windseeker]";
const TF_NAMES = [["Edge","#ff7c0a"],["Ima","#f48cba"],["Noah","#ffffff"],["Amy","#00ff98"],["Zarnox","#8788ee"],
  ["Gøj","#c69b6d"],["Maiken","#3fc7eb"],["Sabre","#fff468"],["Fred","#0070dd"],["Ave","#aad372"],
  ["Larry","#c41e3a"],["Mykuru","#3fc7eb"],["Farrenor","#33937f"],["Brydon","#a330c9"]];
const TF_LINES = [
  ["Did someone say ", TF_LINK, "?"],
  ["Did someone say ", TF_LINK, "?"],
  ["did someone say ", TF_LINK, "??"],
  ["DID SOMEONE SAY ", TF_LINK, "?!"],
  ["WTS ", TF_LINK, " 9999g pst"],
  ["LF ", "[Bindings of the Windseeker]", " (left side) pls"],
  ["omg not again", "", ""],
  ["ty ", TF_LINK, " very cool"]
];
let tfOn = false;
function thunder() {
  if (!ctx || muted) return;
  const t = ctx.currentTime, len = ctx.sampleRate * 3;
  const nb = ctx.createBuffer(1, len, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
  // sharp crack
  const c = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), cg = ctx.createGain();
  c.buffer = nb; hp.type = "highpass"; hp.frequency.value = 1500;
  cg.gain.setValueAtTime(0.5, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  c.connect(hp).connect(cg); out(cg, true); c.start(t); c.stop(t + 0.3);
  // long rolling rumble
  const r = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), rg = ctx.createGain();
  r.buffer = nb; lp.type = "lowpass"; lp.frequency.setValueAtTime(400, t); lp.frequency.exponentialRampToValueAtTime(90, t + 2.8);
  rg.gain.setValueAtTime(0.0001, t); rg.gain.exponentialRampToValueAtTime(1.4, t + 0.08);
  rg.gain.exponentialRampToValueAtTime(0.0001, t + 2.9);
  r.connect(lp).connect(rg); out(rg, true); r.start(t); r.stop(t + 3);
}
function tfLine(parts, name) {
  const p = document.createElement("p"), nm = document.createElement("span"), lg = document.createElement("span");
  nm.textContent = name[0]; nm.style.color = name[1];
  lg.className = "lg"; lg.textContent = parts[1];
  p.append("[2. Trade] [", nm, "]: " + parts[0], lg, parts[2]);
  $("tfchat").appendChild(p);
}
function thunderfury() {
  if (tfOn) return;
  tfOn = true;
  const chat = $("tfchat"), fl = $("flash");
  chat.textContent = "";
  fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
  thunder();
  chat.classList.add("on");
  const names = TF_NAMES.slice().sort(() => Math.random() - .5);
  const lines = [TF_LINES[0]].concat(TF_LINES.slice(1).sort(() => Math.random() - .5), [TF_LINES[0]]);
  lines.forEach((l, i) => setTimeout(() => tfLine(l, names[i % names.length]), 400 + i * 550));
  setTimeout(() => chat.classList.remove("on"), 400 + lines.length * 550 + 5000);
  setTimeout(() => { chat.textContent = ""; tfOn = false; }, 400 + lines.length * 550 + 5600);
}
$("undisco").addEventListener("click", stopDisco);
$("vol").addEventListener("input", () => {
  if (yt && yt.setVolume) yt.setVolume(vol());
  if (discoGain && musicOn) discoGain.gain.value = vol() / 100;
});
$("mmute").addEventListener("click", () => {
  musicOn = !musicOn;
  $("mmute").textContent = musicOn ? "🎵 Music on" : "🔇 Music off";
  if (discoGain) discoGain.gain.value = musicOn ? vol() / 100 : 0;
  else if (yt && yt.playVideo) musicOn ? yt.playVideo() : yt.pauseVideo();
});

// ---------- Easter egg: click "Forever" 10 times ----------
// Plays sandstorm.swf once through Ruffle (Flash emulator) in an overlay; background audio pauses meanwhile.
let eggClicks = 0, eggTimer = null, eggPlayer = null, eggEnd = null;
function loadRuffle() {
  if (window.RufflePlayer && RufflePlayer.newest) return Promise.resolve();
  window.RufflePlayer = { config: { autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, contextMenu: "off" } };
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://unpkg.com/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.1/ruffle.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
function openEgg() {
  if (eggOn) return;
  eggOn = true;
  if (discoGain) discoGain.gain.value = 0; else if (yt && yt.pauseVideo) yt.pauseVideo();
  $("eggbox").classList.add("on");
  loadRuffle().then(() => {
    if (!eggOn) return;
    eggPlayer = RufflePlayer.newest().createPlayer();
    $("eggstage").appendChild(eggPlayer);
    eggPlayer.addEventListener("loadedmetadata", () => {
      const m = eggPlayer.metadata;
      eggEnd = setTimeout(closeEgg, m.numFrames / m.frameRate * 1000 - 60);
    });
    eggPlayer.load("sandstorm.swf");
  }).catch(closeEgg);
}
function closeEgg() {
  if (!eggOn) return;
  clearTimeout(eggEnd);
  if (eggPlayer) { eggPlayer.remove(); eggPlayer = null; }
  $("eggbox").classList.remove("on");
  eggOn = false;
  if (!musicOn) return;
  if (discoGain) discoGain.gain.value = vol() / 100; else if (yt && yt.playVideo) yt.playVideo();
}
// each click makes "Forever" glow brighter and shake harder, so people keep going
function eggHeat(n) {
  const el = $("egg");
  el.style.setProperty("--heat", n / 10);
  el.classList.remove("shake"); void el.offsetWidth; if (n) el.classList.add("shake");
}
$("egg").addEventListener("click", () => {
  clearTimeout(eggTimer);
  eggTimer = setTimeout(() => { eggClicks = 0; eggHeat(0); }, 2000);
  eggHeat(++eggClicks);
  if (eggClicks < 10) return;
  eggClicks = 0;
  setTimeout(() => eggHeat(0), 300);
  openEgg();
});

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
let tipOrder = [], tipPos = 0, tipCount = 0, hintPos = 0;
function nextTip() {
  let html;
  if (++tipCount % 4 === 0) html = "<b>Tip:</b> " + esc(HINTS[hintPos++ % HINTS.length]);
  else {
    if (tipPos >= tipOrder.length) {
      tipOrder = TIPS.map(t => "<b>Tip:</b> " + esc(t))
        .concat(QUOTES.map(q => "<b>Tip:</b> " + esc(q)))
        .sort(() => Math.random() - .5);
      tipPos = 0;
    }
    html = tipOrder[tipPos++];
  }
  const el = $("tip");
  el.classList.add("hide");
  setTimeout(() => { el.innerHTML = html; el.classList.remove("hide"); }, 600);
}
nextTip();
